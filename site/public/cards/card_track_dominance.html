const DRIVERS = ['ANT','RUS','LEC'];
const COLORS  = {
  ANT: GPS.ANT_color || '#FFD700',
  RUS: GPS.RUS_color || '#00D2BE',
  LEC: GPS.LEC_color || '#E8002D',
};

// Legend
const legendEl = document.getElementById('legend');
DRIVERS.forEach(d=>{
  const item = document.createElement('div'); item.className='leg';
  item.innerHTML=`<div class="leg-dot" style="background:${COLORS[d]};box-shadow:0 0 6px ${COLORS[d]}80;"></div><span style="color:${COLORS[d]}">${d}</span>`;
  legendEl.appendChild(item);
});

// Sector info — lap times would come from tele data
const sinfoEl = document.getElementById('sinfo');

function drawTrack() {
  const canvas = document.getElementById('track');
  const area   = canvas.parentElement;
  const DPR = window.devicePixelRatio||1;
  // leave room for sector info at bottom
  const cssW = area.clientWidth;
  const cssH = area.clientHeight - 60;
  canvas.width=cssW*DPR; canvas.height=cssH*DPR;
  canvas.style.width=cssW+'px'; canvas.style.height=cssH+'px';
  const W=canvas.width, H=canvas.height;
  const ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,W,H);

  // Get ANT GPS as reference for coordinate transform
  const ref = GPS['ANT'];
  if(!ref||!ref.length) return;

  const xs = ref.map(p=>p.x), ys = ref.map(p=>p.y);
  const xMin=Math.min(...xs), xMax=Math.max(...xs);
  const yMin=Math.min(...ys), yMax=Math.max(...ys);
  const range = Math.max(xMax-xMin, yMax-yMin);
  const PAD = 60*DPR;
  const scale = (Math.min(W,H) - PAD*2) / range;
  const cx = W/2 - (xMin+xMax)/2*scale;
  const cy = H/2 + (yMin+yMax)/2*scale; // y inverted

  const tx = x => x*scale + cx;
  const ty = y => -y*scale + cy;

  // Draw base track (thick dark underlay)
  ctx.save();
  ctx.strokeStyle='#1a1a1a'; ctx.lineWidth=18*DPR; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath();
  ref.forEach((p,i)=>i===0?ctx.moveTo(tx(p.x),ty(p.y)):ctx.lineTo(tx(p.x),ty(p.y)));
  ctx.closePath(); ctx.stroke(); ctx.restore();

  // For each point, find fastest driver and color that segment
  const n = Math.min(...DRIVERS.map(d=>(GPS[d]||[]).length));
  if(n<2) return;

  for(let i=0;i<n-1;i++){
    // Find fastest at this point by highest speed
    let fastest = null, fastestSpeed = -1;
    DRIVERS.forEach(d=>{
      const pt = (GPS[d]||[])[i];
      if(pt && pt.s > fastestSpeed){ fastestSpeed=pt.s; fastest=d; }
    });
    if(!fastest) continue;

    const p1 = GPS['ANT'][i], p2 = GPS['ANT'][i+1];
    ctx.save();
    ctx.strokeStyle = COLORS[fastest];
    ctx.lineWidth   = 8*DPR;
    ctx.lineCap     = 'round';
    ctx.globalAlpha = 0.9;
    ctx.shadowColor = COLORS[fastest];
    ctx.shadowBlur  = 4*DPR;
    ctx.beginPath();
    ctx.moveTo(tx(p1.x),ty(p1.y));
    ctx.lineTo(tx(p2.x),ty(p2.y));
    ctx.stroke();
    ctx.restore();
  }

  // Start/finish marker
  const sp = ref[0];
  ctx.save();
  ctx.fillStyle='#ffffff';
  ctx.beginPath();
  ctx.arc(tx(sp.x),ty(sp.y),6*DPR,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
}

window.addEventListener('load',()=>setTimeout(drawTrack,50));
window.addEventListener('resize',()=>setTimeout(drawTrack,50));
