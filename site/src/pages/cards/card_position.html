const ANT_COLOR = '#FFD700', RUS_COLOR = '#00D2BE';
const HIGHLIGHT = ['ANT','RUS'];

const canvas = document.getElementById('c');
const wrap   = document.getElementById('wrap');

function draw() {
  const DPR = window.devicePixelRatio || 1;
  const cssW = wrap.clientWidth, cssH = wrap.clientHeight;
  canvas.width = cssW*DPR; canvas.height = cssH*DPR;
  canvas.style.width = cssW+'px'; canvas.style.height = cssH+'px';
  const W = canvas.width, H = canvas.height;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,W,H);

  const PAD = {t:20*DPR, r:60*DPR, b:40*DPR, l:40*DPR};
  const CW = W-PAD.l-PAD.r, CH = H-PAD.t-PAD.b;

  const allLaps = Object.values(POS).flatMap(d=>d.laps);
  const maxLap  = Math.max(...allLaps);
  const xOf = lap => PAD.l + (lap-1)/(maxLap-1)*CW;
  const yOf = pos => PAD.t + (pos-1)/19*CH;

  // grid
  ctx.strokeStyle='rgba(255,255,255,0.03)'; ctx.lineWidth=DPR;
  for(let p=1;p<=20;p+=5){const py=yOf(p);ctx.beginPath();ctx.moveTo(PAD.l,py);ctx.lineTo(W-PAD.r,py);ctx.stroke();}
  for(let l=10;l<=maxLap;l+=10){const px=xOf(l);ctx.beginPath();ctx.moveTo(px,PAD.t);ctx.lineTo(px,H-PAD.b);ctx.stroke();}

  // y axis
  ctx.fillStyle='#2a2a2a'; ctx.font=`${11*DPR}px "IBM Plex Mono"`; ctx.textAlign='right';
  [1,5,10,15,20].forEach(p=>ctx.fillText('P'+p, PAD.l-6*DPR, yOf(p)+4*DPR));
  ctx.textAlign='center'; ctx.fillStyle='#252525';
  for(let l=10;l<=maxLap;l+=10) ctx.fillText('L'+l,xOf(l),H-PAD.b+14*DPR);

  // draw all non-highlight first (dim)
  Object.entries(POS).forEach(([abbr,d])=>{
    if(HIGHLIGHT.includes(abbr)) return;
    if(d.laps.length<2) return;
    ctx.save(); ctx.strokeStyle=d.color; ctx.lineWidth=1*DPR;
    ctx.globalAlpha=0.18; ctx.lineJoin='round';
    ctx.beginPath();
    d.laps.forEach((lap,i)=>{const px=xOf(lap),py=yOf(d.pos[i]);i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);});
    ctx.stroke(); ctx.restore();
  });

  // draw highlights on top
  HIGHLIGHT.forEach(abbr=>{
    const d = POS[abbr]; if(!d||d.laps.length<2) return;
    const color = abbr==='ANT'?ANT_COLOR:RUS_COLOR;
    ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=3*DPR;
    ctx.globalAlpha=0.95; ctx.lineJoin='round';
    ctx.shadowColor=color; ctx.shadowBlur=8*DPR;
    ctx.beginPath();
    d.laps.forEach((lap,i)=>{const px=xOf(lap),py=yOf(d.pos[i]);i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);});
    ctx.stroke(); ctx.restore();

    // end label
    const lastLap = d.laps[d.laps.length-1];
    const lastPos = d.pos[d.pos.length-1];
    ctx.save(); ctx.fillStyle=color; ctx.font=`${13*DPR}px "IBM Plex Mono"`;
    ctx.textAlign='left';
    ctx.fillText(abbr+' P'+lastPos, xOf(lastLap)+8*DPR, yOf(lastPos)+4*DPR);
    ctx.restore();
  });

  ctx.strokeStyle='#111'; ctx.lineWidth=DPR; ctx.setLineDash([]);
  ctx.strokeRect(PAD.l,PAD.t,CW,CH);
}

window.addEventListener('load',()=>setTimeout(draw,50));
window.addEventListener('resize',()=>setTimeout(draw,50));
