function makeChart(cId,wId,drawFn,showX){
  const canvas=document.getElementById(cId),wrap=document.getElementById(wId);
  const DPR=window.devicePixelRatio||1;
  const cssW=wrap.clientWidth,cssH=wrap.clientHeight;
  canvas.width=cssW*DPR;canvas.height=cssH*DPR;
  canvas.style.width=cssW+'px';canvas.style.height=cssH+'px';
  const W=canvas.width,H=canvas.height,ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,W,H);
  const PAD={t:showX?10*DPR:6*DPR,r:8*DPR,b:showX?28*DPR:6*DPR,l:6*DPR};
  const CW=W-PAD.l-PAD.r,CH=H-PAD.t-PAD.b;
  const maxD=T.maxDist;
  const xOf=d=>PAD.l+(d/maxD)*CW;

  // sector shading
  ctx.fillStyle='rgba(255,255,255,0.01)';
  ctx.fillRect(PAD.l,PAD.t,xOf(T.s1Dist)-PAD.l,CH);
  ctx.fillRect(xOf(T.s2Dist),PAD.t,W-PAD.r-xOf(T.s2Dist),CH);

  // sector dividers
  [T.s1Dist,T.s2Dist].forEach((sd,i)=>{
    const px=xOf(sd);
    ctx.save();ctx.strokeStyle='rgba(255,255,255,0.12)';ctx.lineWidth=1*DPR;ctx.setLineDash([3*DPR,3*DPR]);
    ctx.beginPath();ctx.moveTo(px,PAD.t);ctx.lineTo(px,PAD.t+CH);ctx.stroke();ctx.restore();
    if(showX){
      ctx.fillStyle='rgba(255,255,255,0.35)';ctx.font=`${10*DPR}px "IBM Plex Mono"`;ctx.textAlign='center';
      ctx.fillText('S'+(i+2),px,PAD.t+11*DPR);
    }
  });
  if(showX){
    ctx.fillStyle='rgba(255,255,255,0.35)';ctx.font=`${10*DPR}px "IBM Plex Mono"`;ctx.textAlign='left';
    ctx.fillText('S1',PAD.l+4*DPR,PAD.t+11*DPR);
    // x ticks
    ctx.textAlign='center';ctx.fillStyle='#1e1e1e';
    [0,1000,2000,3000,4000,5000].filter(d=>d<=maxD).forEach(d=>ctx.fillText(d,xOf(d),PAD.t+CH+14*DPR));
  }

  drawFn(ctx,PAD,CW,CH,xOf);
  ctx.strokeStyle='#111';ctx.lineWidth=DPR;ctx.setLineDash([]);ctx.strokeRect(PAD.l,PAD.t,CW,CH);
}

function drawLine(ctx,PAD,CW,CH,xOf,data,key,yMin,yMax,color){
  const yOf=v=>PAD.t+(1-(v-yMin)/(yMax-yMin))*CH;
  const DPR=window.devicePixelRatio||1;
  ctx.save();ctx.strokeStyle=color;ctx.lineWidth=2*DPR;ctx.lineJoin='round';ctx.lineCap='round';ctx.globalAlpha=0.9;
  ctx.beginPath();
  data.forEach((p,i)=>{const px=xOf(p.d),py=yOf(p[key]);i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);});
  ctx.stroke();ctx.restore();
}

function drawBrakeFill(ctx,PAD,CW,CH,xOf,data,color,yFrac){
  const DPR=window.devicePixelRatio||1;
  const barH=CH*0.44;
  const baseY=PAD.t+CH*yFrac;
  ctx.save();ctx.fillStyle=color;ctx.globalAlpha=0.75;
  for(let i=0;i<data.length-1;i++){
    if(data[i].br===1){
      const x1=xOf(data[i].d),x2=xOf(data[i+1].d);
      ctx.fillRect(x1,baseY-barH,Math.max(x2-x1,1.5*DPR),barH);
    }
  }
  ctx.restore();
  // label
  ctx.save();ctx.fillStyle=color;ctx.globalAlpha=0.5;ctx.font=`${9*(window.devicePixelRatio||1)}px "IBM Plex Mono"`;
  ctx.textAlign='right';ctx.fillText(color===ANT?'ANT':'RUS',PAD.l-2*(window.devicePixelRatio||1),baseY-barH*0.5+3*(window.devicePixelRatio||1));
  ctx.restore();
}

function drawYTicks(ctx,PAD,CH,yMin,yMax,steps){
  const DPR=window.devicePixelRatio||1;
  ctx.save();ctx.fillStyle='#2a2a2a';ctx.font=`${10*DPR}px "IBM Plex Mono"`;ctx.textAlign='right';
  ctx.strokeStyle='rgba(255,255,255,0.04)';ctx.lineWidth=DPR;ctx.setLineDash([]);
  for(let i=0;i<=steps;i++){
    const v=yMin+(yMax-yMin)*i/steps;
    const py=PAD.t+(1-i/steps)*CH;
    ctx.beginPath();ctx.moveTo(PAD.l,py);ctx.lineTo(PAD.l+(window.innerWidth||1080)*2,py);ctx.stroke();
    ctx.fillText(Math.round(v),PAD.l-2*DPR,py+3*DPR);
  }
  ctx.restore();
}

function drawAll(){
  makeChart('cs','ws',(ctx,PAD,CW,CH,xOf)=>{
    drawYTicks(ctx,PAD,CH,60,340,4);
    drawLine(ctx,PAD,CW,CH,xOf,T.rus,'s',60,340,RUS);
    drawLine(ctx,PAD,CW,CH,xOf,T.ant,'s',60,340,ANT);
  },false);

  makeChart('ct','wt',(ctx,PAD,CW,CH,xOf)=>{
    drawYTicks(ctx,PAD,CH,0,100,4);
    drawLine(ctx,PAD,CW,CH,xOf,T.rus,'th',0,105,RUS);
    drawLine(ctx,PAD,CW,CH,xOf,T.ant,'th',0,105,ANT);
  },false);

  makeChart('cb','wb',(ctx,PAD,CW,CH,xOf)=>{
    drawBrakeFill(ctx,PAD,CW,CH,xOf,T.ant,ANT,0.48);
    drawBrakeFill(ctx,PAD,CW,CH,xOf,T.rus,RUS,0.98);
  },true);
}

window.addEventListener('load',()=>setTimeout(drawAll,60));
