<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>Championship Choke Artists — Motorsports Visualised</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:transparent;display:flex;justify-content:center;align-items:center;min-height:100vh}
.card{width:1080px;height:1080px;background:#060606;position:relative;overflow:hidden;padding:48px 56px}
.wm{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.15em;color:#181818;position:absolute;top:28px;right:56px;text-transform:uppercase}
.ttl{font-family:'Bebas Neue',sans-serif;font-size:52px;letter-spacing:0.06em;color:#e0e0e0;line-height:1}
.sub{font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:0.18em;color:#252525;text-transform:uppercase;margin-top:6px}
.tiers{margin-top:40px;display:flex;flex-direction:column;gap:24px}
.tier-row{display:flex;align-items:stretch;gap:20px}
.tier-label{width:72px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:64px;border-radius:6px;line-height:1}
.tier-cards{flex:1;display:flex;gap:14px;flex-wrap:wrap}
.driver-card{background:#0a0a0a;border:1px solid #0e0e14;border-radius:4px;padding:16px 20px;flex:1;min-width:200px;display:flex;flex-direction:column;gap:8px}
.driver-card .code{font-family:'Bebas Neue',sans-serif;font-size:40px;line-height:1}
.driver-card .note{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#555;line-height:1.5;letter-spacing:0.02em}
.choke-meter{height:4px;background:#111;border-radius:2px;margin-top:auto}
.choke-fill{height:100%;border-radius:2px}
</style>
</head>
<body>
<div class="card">
  <div class="wm">MOTORSPORTS-VISUALISED</div>
  <div class="ttl">CHAMPIONSHIP CHOKE ARTISTS</div>
  <div class="sub">RANKED BY HOW BADLY THEY BOTTLED IT</div>
  <div class="tiers" id="tiers"></div>
</div>
<script>
const tiers = [
  { tier:'S', bg:'#e80020', choke:100, drivers:[
    {c:'NOR',n:'2024: HAD THE CAR, COULDN\'T CLOSE',color:'#ff8000'},
    {c:'VET',n:'2018: HOCKENHEIM → MONZA → COLLAPSE',color:'#0600ef'}
  ]},
  { tier:'A', bg:'#ff6b00', choke:80, drivers:[
    {c:'LEC',n:'2022: STRATEGY + OWN ERRORS',color:'#e80020'},
    {c:'HAM',n:'2007 CHINA PIT / 2021 ABU DHABI',color:'#27f4d2'}
  ]},
  { tier:'B', bg:'#ffb800', choke:55, drivers:[
    {c:'ALO',n:'2010: STUCK BEHIND PETROV',color:'#00665f'},
    {c:'MAS',n:'2008: LOST BY 1 PT LAST CORNER',color:'#e80020'}
  ]},
  { tier:'C', bg:'#555', choke:30, drivers:[
    {c:'VER',n:'2021: ALMOST LOST BUT DIDN\'T',color:'#0600ef'},
    {c:'RAI',n:'2005: ENGINE BLEW WHILE LEADING',color:'#b6babd'}
  ]}
];

const container = document.getElementById('tiers');
tiers.forEach(t => {
  const row = document.createElement('div');
  row.className = 'tier-row';
  row.innerHTML = `
    <div class="tier-label" style="background:${t.bg}15;color:${t.bg}">${t.tier}</div>
    <div class="tier-cards">
      ${t.drivers.map(d => `
        <div class="driver-card">
          <div class="code" style="color:${d.color}">${d.c}</div>
          <div class="note">${d.n}</div>
          <div class="choke-meter"><div class="choke-fill" style="width:${t.choke}%;background:${t.bg}"></div></div>
        </div>
      `).join('')}
    </div>
  `;
  container.appendChild(row);
});
</script>
</body>
</html>
