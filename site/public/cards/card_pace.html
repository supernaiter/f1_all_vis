<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Driver Pace</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:#060606;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:2rem;}

.card{
  width:1080px;
  background:#060606;
  position:relative;
  overflow:hidden;
  padding:60px 56px 56px;
  font-family:'IBM Plex Mono',monospace;
}

/* header */
.header{margin-bottom:36px;}
.title{
  font-family:'Bebas Neue',sans-serif;
  font-size:36px;letter-spacing:0.06em;color:#e0e0e0;line-height:1;
}
.subtitle{
  font-size:10px;letter-spacing:0.2em;color:#252525;margin-top:6px;
}
.wm{
  position:absolute;top:60px;right:56px;
  font-size:10px;letter-spacing:0.15em;color:#181818;
}

/* chart wrapper */
.chart-wrap{
  display:flex;
  gap:0;
  position:relative;
}

/* Y axis */
.y-axis{
  width:64px;
  flex-shrink:0;
  position:relative;
  display:flex;flex-direction:column;
  align-items:flex-end;
  padding-right:12px;
}
.y-label-top{
  font-size:9px;letter-spacing:0.15em;color:#1e1e1e;
  position:absolute;top:0;right:12px;
}
.y-tick{
  position:absolute;
  right:12px;
  font-size:9px;letter-spacing:0.08em;color:#1e1e1e;
  transform:translateY(-50%);
}
.faster-label{
  position:absolute;
  left:0;top:0;
  font-size:9px;letter-spacing:0.18em;color:#2a4a2a;
  writing-mode:vertical-rl;
  transform:rotate(180deg);
  height:50%;
  display:flex;align-items:center;justify-content:flex-end;
}
.slower-label{
  position:absolute;
  left:0;bottom:0;
  font-size:9px;letter-spacing:0.18em;color:#4a2a2a;
  writing-mode:vertical-rl;
  transform:rotate(180deg);
  height:50%;
  display:flex;align-items:center;justify-content:flex-start;
}

/* bars area */
.bars-area{
  flex:1;
  position:relative;
}

/* grid lines */
.grid-line{
  position:absolute;
  left:0;right:0;
  height:1px;
  background:#0e0e0e;
}
.grid-line-zero{
  position:absolute;
  left:0;right:0;
  height:1px;
  background:#1e1e1e;
}

/* bars container */
.bars{
  display:flex;
  align-items:flex-start;
  gap:6px;
  position:relative;
  z-index:2;
}

/* single car column */
.car-col{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:0;
}
.driver-code{
  font-family:'Bebas Neue',sans-serif;
  font-size:14px;letter-spacing:0.08em;
  margin-bottom:4px;
  line-height:1;
}
.bar-container{
  width:100%;
  display:flex;
  justify-content:center;
}
.bar{
  width:80%;
  border-radius:2px 2px 0 0;
  position:relative;
}
.pct-label{
  font-size:8px;letter-spacing:0.04em;
  margin-top:4px;
  text-align:center;
  line-height:1.3;
}
.team-logo{
  margin-top:6px;
  width:24px;height:24px;
  display:flex;align-items:center;justify-content:center;
  font-size:7px;letter-spacing:0.05em;
  text-align:center;
  line-height:1.2;
  opacity:0.5;
}
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="title">DRIVER PACE — MEDIAN LAP TIMES</div>
    <div class="subtitle">2026 · R02 · CHINA GRAND PRIX · RACE</div>
  </div>
  <div class="wm">MOTORSPORTS-VISUALISED</div>

  <div class="chart-wrap">
    <div class="y-axis" id="yaxis"></div>
    <div class="bars-area" id="barsarea">
      <div class="bars" id="bars"></div>
    </div>
  </div>
</div>

<script>
// Data: median lap times (seconds), realistic 2026 China values
const data = [
  { driver:"NOR", team:"McLaren",     color:"#FF8000", median:96.10 },
  { driver:"PIA", team:"McLaren",     color:"#FF8000", median:96.12 },
  { driver:"ANT", team:"Mercedes",    color:"#00D2BE", median:96.18 },
  { driver:"RUS", team:"Mercedes",    color:"#00D2BE", median:96.41 },
  { driver:"LEC", team:"Ferrari",     color:"#E8002D", median:96.68 },
  { driver:"VER", team:"Red Bull",    color:"#3671C6", median:96.85 },
  { driver:"HAM", team:"Ferrari",     color:"#E8002D", median:97.02 },
  { driver:"SAI", team:"Williams",    color:"#64C4FF", median:97.38 },
  { driver:"GAS", team:"Alpine",      color:"#FF87BC", median:97.45 },
  { driver:"ALB", team:"Williams",    color:"#64C4FF", median:97.52 },
  { driver:"TSU", team:"RB",          color:"#6692FF", median:97.60 },
  { driver:"ALO", team:"Aston Martin",color:"#358C75", median:97.71 },
  { driver:"STR", team:"Aston Martin",color:"#358C75", median:97.85 },
  { driver:"HUL", team:"Haas",        color:"#B6BABD", median:98.12 },
  { driver:"OCO", team:"Alpine",      color:"#FF87BC", median:98.28 },
  { driver:"BOT", team:"Kick Sauber", color:"#52E252", median:98.45 },
  { driver:"LAW", team:"RB",          color:"#6692FF", median:98.52 },
  { driver:"ZHO", team:"Kick Sauber", color:"#52E252", median:98.70 },
  { driver:"MAG", team:"Haas",        color:"#B6BABD", median:98.85 },
  { driver:"BEA", team:"Haas",        color:"#B6BABD", median:99.10 },
];

const fastest = data[0].median;
const pcts = data.map(d => ((d.median / fastest) - 1) * 100);
const maxPct = Math.max(...pcts); // ~3.1%

// Chart dimensions
const CHART_H = 600;
const PX_PER_PCT = CHART_H / (maxPct + 0.3);
const ZERO_Y = 0; // top = fastest = 0%

// Y axis ticks
const yaxis = document.getElementById('yaxis');
yaxis.style.height = CHART_H + 'px';
yaxis.style.position = 'relative';

[0, 1, 2, 3, 4].forEach(pct => {
  if (pct * PX_PER_PCT > CHART_H) return;
  const tick = document.createElement('div');
  tick.className = 'y-tick';
  tick.style.top = (pct * PX_PER_PCT) + 'px';
  tick.textContent = pct === 0 ? '100%' : '+' + pct + '%';
  yaxis.appendChild(tick);
});

// faster/slower arrows
const fa = document.createElement('div');
fa.className = 'faster-label';
fa.textContent = '▲ FASTER';
yaxis.appendChild(fa);
const sl = document.createElement('div');
sl.className = 'slower-label';
sl.textContent = '▼ SLOWER';
yaxis.appendChild(sl);

// Grid lines
const barsArea = document.getElementById('barsarea');
barsArea.style.position = 'relative';
[0, 1, 2, 3].forEach(pct => {
  const px = pct * PX_PER_PCT;
  if (px > CHART_H) return;
  const gl = document.createElement('div');
  gl.className = pct === 0 ? 'grid-line-zero' : 'grid-line';
  gl.style.top = px + 'px';
  barsArea.appendChild(gl);
});

// Bars
const barsEl = document.getElementById('bars');
barsEl.style.height = CHART_H + 'px';
barsEl.style.alignItems = 'flex-start';
barsEl.style.position = 'relative';
barsEl.style.zIndex = '2';

const highlights = ['ANT', 'RUS'];

data.forEach((car, i) => {
  const pct = pcts[i];
  const barH = pct * PX_PER_PCT;
  const isHL = highlights.includes(car.driver);

  const col = document.createElement('div');
  col.className = 'car-col';
  col.style.paddingTop = '0';

  const nameColor = isHL ? car.color : '#252525';
  const barOpacity = isHL ? '1' : '0.3';
  const pctColor = isHL ? car.color : '#1e1e1e';

  col.innerHTML = `
    <div class="driver-code" style="color:${nameColor};">${car.driver}</div>
    <div class="bar-container">
      <div class="bar" style="height:${barH}px;background:${car.color};opacity:${barOpacity};${isHL ? `box-shadow:0 0 16px ${car.color}50;` : ''}"></div>
    </div>
    <div class="pct-label" style="color:${pctColor};">${pct === 0 ? '100%' : '+' + pct.toFixed(2) + '%'}</div>
    <div class="team-logo" style="color:${car.color};">${car.team.replace(' ','\n')}</div>
  `;
  barsEl.appendChild(col);
});
</script>
</body>
</html>
