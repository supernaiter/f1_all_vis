<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Race Sim Pace 3-Driver</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:#060606;display:flex;align-items:center;justify-content:center;min-height:100vh;}
.card{width:1080px;height:1080px;background:#060606;position:relative;overflow:hidden;display:flex;flex-direction:column;padding:72px 72px 64px 64px;}
.title{font-family:'Bebas Neue',sans-serif;font-size:42px;letter-spacing:0.06em;color:#e0e0e0;line-height:1;}
.subtitle{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.2em;color:#252525;margin-top:6px;}
.wm{position:absolute;top:72px;right:64px;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.15em;color:#181818;}
.focus-strip{display:flex;gap:0;margin-bottom:20px;flex-shrink:0;border:1px solid #111;overflow:hidden;border-radius:3px;}
.fc{flex:1;padding:16px 20px;background:#0a0a0a;}
.fc+.fc{border-left:1px solid #111;}
.fc-drv{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:0.08em;line-height:1;}
.fc-team{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:0.16em;color:#2a2a2a;margin-top:2px;}
.fc-pace{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:600;margin-top:8px;}
.fc-gap{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.1em;margin-top:3px;}
.chart{flex:1;display:flex;flex-direction:column;justify-content:space-evenly;position:relative;}
.team-row{display:grid;grid-template-columns:200px 1fr 140px;align-items:center;position:relative;z-index:2;}
.team-name{font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:0.06em;text-align:right;padding-right:16px;line-height:1;}
.bar-track{height:28px;background:#0a0a0a;border-radius:0 3px 3px 0;overflow:hidden;}
.bar-fill{height:100%;border-radius:0 3px 3px 0;}
.val{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.06em;padding-left:14px;white-space:nowrap;}
.x-axis{flex-shrink:0;display:grid;grid-template-columns:200px 1fr;margin-top:6px;}
.x-ticks{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:0.1em;color:#1e1e1e;}
.x-label{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:0.14em;color:#1a1a1a;text-align:center;margin-top:4px;grid-column:2;}
</style></head><body>
<div class="card">
  <div style="flex-shrink:0;margin-bottom:10px;">
    <div class="title">RACE SIMULATION PACE</div>
    <div class="subtitle">2026 · R02 · CHINA GP · CLEAN LAPS MEDIAN (≤107% PERSONAL BEST) — FastF1 DATA</div>
  </div>
  <div class="wm">MOTORSPORTS-VISUALISED</div>
  <div class="focus-strip">
    <div class="fc">
      <div class="fc-drv" style="color:#FFD700;">ANT</div>
      <div class="fc-team">MERCEDES</div>
      <div class="fc-pace" style="color:#FFD700;">96.478s</div>
      <div class="fc-gap" style="color:#555;"> +0.065s/LAP</div>
    </div>
    <div class="fc">
      <div class="fc-drv" style="color:#27f4d2;">RUS</div>
      <div class="fc-team">MERCEDES</div>
      <div class="fc-pace" style="color:#27f4d2;">96.413s</div>
      <div class="fc-gap" style="color:#27f4d2;"> FASTEST</div>
    </div>
    <div class="fc">
      <div class="fc-drv" style="color:#e80020;">LEC</div>
      <div class="fc-team">FERRARI</div>
      <div class="fc-pace" style="color:#e80020;">96.837s</div>
      <div class="fc-gap" style="color:#555;">+0.424s/LAP</div>
    </div>
  </div>
  <div class="chart" id="chart"></div>
  <div class="x-axis"><div></div><div><div class="x-ticks" id="xticks"></div><div class="x-label">GAP TO FASTEST — SEC / LAP</div></div></div>
</div>
<script>
const teams=[{"team": "Mercedes", "color": "#27f4d2", "median": 96.413, "gap": 0.0}, {"team": "Ferrari", "color": "#e80020", "median": 96.837, "gap": 0.424}, {"team": "Haas F1 Team", "color": "#b6babd", "median": 97.496, "gap": 1.083}, {"team": "Alpine", "color": "#ff87bc", "median": 97.589, "gap": 1.176}, {"team": "Red Bull Racing", "color": "#0600ef", "median": 97.716, "gap": 1.303}, {"team": "Racing Bulls", "color": "#fcd700", "median": 98.047, "gap": 1.634}, {"team": "Audi", "color": "#ff2d00", "median": 98.388, "gap": 1.975}, {"team": "Williams", "color": "#00a0dd", "median": 98.708, "gap": 2.295}, {"team": "Cadillac", "color": "#444444", "median": 99.813, "gap": 3.4}, {"team": "Aston Martin", "color": "#00665f", "median": 100.356, "gap": 3.943}];
const FOCUS={'Mercedes':['ANT','RUS'],'Ferrari':['LEC']};
const FCOLORS={'ANT':'#FFD700','RUS':'#27f4d2','LEC':'#e80020'};
const MAX_GAP=Math.ceil(Math.max(...teams.map(d=>d.gap))*10)/10+0.2;
const ticks=[];
for(let v=0;v<=MAX_GAP;v+=0.5)ticks.push(v);
document.getElementById('xticks').innerHTML=ticks.map(t=>`<span>${t.toFixed(1)}</span>`).join('');
const chart=document.getElementById('chart');
teams.forEach(t=>{
  const fDrvs=FOCUS[t.team]||[];
  const isHL=fDrvs.length>0;
  const pct=t.gap/MAX_GAP*100;
  const nameOp=isHL?1:t.gap<1?0.4:t.gap<2?0.25:0.12;
  const barOp=isHL?1:t.gap<1?0.55:t.gap<2?0.3:0.15;
  const valCol=isHL?t.color:t.gap<1?t.color:'#1e1e1e';
  const glow=isHL&&t.gap===0?`box-shadow:0 0 20px ${t.color}50;`:'';
  const badges=fDrvs.map(d=>`<span style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:${FCOLORS[d]};letter-spacing:0.1em;margin-left:8px;">${d}</span>`).join('');
  const row=document.createElement('div');row.className='team-row';
  row.innerHTML=`<div class="team-name" style="color:${t.color};opacity:${nameOp};">${t.team}${badges}</div>
    <div class="bar-track"><div class="bar-fill" style="width:${Math.max(pct,0.3)}%;background:${t.color};opacity:${barOp};${glow}"></div></div>
    <div class="val" style="color:${valCol};">+${t.gap.toFixed(3)}s</div>`;
  chart.appendChild(row);
});
</script></body></html>
