const wrap=document.getElementById('wrap');
const canvas=document.getElementById('c');
function median(a){const s=[...a].sort((x,y)=>x-y);const m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2;}
function draw(){
  const rect=wrap.getBoundingClientRect();
  const D=devicePixelRatio||1;
  canvas.width=rect.width*D;canvas.height=rect.height*D;
  const W=canvas.width,H=canvas.height;
  const ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,W,H);
  const PAD={t:24*D,r:20*D,b:48*D,l:64*D};
  const CW=W-PAD.l-PAD.r,CH=H-PAD.t-PAD.b;
  const all=[...antLaps,...rusLaps,...lecLaps].filter(l=>l.time!==null&&!l.isPit).map(l=>l.time);
  const yMin=Math.min(...all)-0.2,yMax=Math.max(...all)+0.3;
  const xOf=lap=>PAD.l+((lap-1)/(LAPS-1))*CW;
  const yOf=t=>PAD.t+(1-(t-yMin)/(yMax-yMin))*CH;
  // grid
  ctx.strokeStyle='rgba(255,255,255,0.02)';ctx.lineWidth=D;
  for(let y=Math.ceil(yMin*2)/2;y<=yMax;y+=0.5){ctx.beginPath();ctx.moveTo(PAD.l,yOf(y));ctx.lineTo(W-PAD.r,yOf(y));ctx.stroke();}
  for(let l=10;l<=LAPS;l+=10){ctx.beginPath();ctx.moveTo(xOf(l),PAD.t);ctx.lineTo(xOf(l),H-PAD.b);ctx.stroke();}
  // ticks
  ctx.fillStyle='#1e1e1e';ctx.font=`${11*D}px "IBM Plex Mono"`;ctx.textAlign='right';
  for(let y=Math.ceil(yMin);y<=Math.floor(yMax);y++)ctx.fillText(y,PAD.l-8*D,yOf(y)+4*D);
  ctx.textAlign='center';
  for(let l=10;l<=LAPS;l+=10)ctx.fillText('L'+l,xOf(l),H-PAD.b+18*D);
  // pit marker lines
  function pitEntries(laps){
    const r=[];let prev=-99;
    laps.forEach(l=>{if(l.isPit){if(l.lap-prev>1)r.push(l.lap);prev=l.lap;}else prev=-99;});
    return r;
  }
  function drawPitLine(lap,col,yOff){
    const px=xOf(lap);
    ctx.save();ctx.strokeStyle=col;ctx.lineWidth=1*D;ctx.setLineDash([2*D,4*D]);ctx.globalAlpha=0.3;
    ctx.beginPath();ctx.moveTo(px,PAD.t);ctx.lineTo(px,H-PAD.b);ctx.stroke();ctx.restore();
    ctx.save();ctx.font=`${8*D}px "IBM Plex Mono"`;ctx.fillStyle=col;ctx.globalAlpha=0.45;ctx.textAlign='center';
    ctx.fillText('PIT',px,PAD.t+yOff*D);ctx.restore();

  pitEntries(lecLaps).filter(l=>l>1).forEach(l=>drawPitLine(l,'#e80020',26));

      const px=xOf(l.lap),py=yOf(l.time);
      if(!pen){ctx.moveTo(px,py);pen=true;}else ctx.lineTo(px,py);
    });
    ctx.stroke();ctx.restore();
  }

  drawSeries(rusLaps,'#27f4d2',1.8,false);
  drawSeries(antLaps,'#FFD700',2.2,true);

  const rc=rusLaps.filter(l=>l.time!==null&&!l.isPit).map(l=>l.time);
  const lc=lecLaps.filter(l=>l.time!==null&&!l.isPit).map(l=>l.time);
  document.getElementById('a-med').textContent=median(ac).toFixed(3)+'s';
