<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>Era-Adjusted Qualifying — Motorsports Visualised</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:transparent;display:flex;justify-content:center;align-items:center;min-height:100vh}
.card{width:1080px;height:1080px;background:#060606;position:relative;overflow:hidden;padding:48px 56px}
.wm{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.15em;color:#181818;position:absolute;top:28px;right:56px;text-transform:uppercase}
.ttl{font-family:'Bebas Neue',sans-serif;font-size:52px;letter-spacing:0.06em;color:#e0e0e0;line-height:1}
.sub{font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:0.18em;color:#252525;text-transform:uppercase;margin-top:6px}
.desc{font-family:'IBM Plex Mono',monospace;font-size:10px;color:#333;letter-spacing:0.1em;margin-top:8px}
.rows{margin-top:28px}
.row{display:flex;align-items:center;margin-bottom:10px}
.rank{font-family:'Bebas Neue',sans-serif;font-size:24px;color:#333;width:36px;text-align:right;margin-right:12px}
.code{font-family:'Bebas Neue',sans-serif;font-size:28px;width:72px;margin-right:8px}
.year{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#555;width:48px;margin-right:12px}
.bar-track{flex:1;height:28px;background:#0a0a0a;border-radius:3px;position:relative;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;display:flex;align-items:center;padding-left:10px}
.zscore{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;color:#fff}
</style>
</head>
<body>
<div class="card">
  <div class="wm">MOTORSPORTS-VISUALISED</div>
  <div class="ttl">ERA-ADJUSTED QUALIFYING</div>
  <div class="sub">MONZA · POLE POSITION Z-SCORE VS FIELD</div>
  <div class="desc">HOW FAR AHEAD OF THE FIELD WAS POLE — NORMALIZED ACROSS ERAS</div>
  <div class="rows" id="rows"></div>
</div>
<script>
const data = [
  {code:'SEN',year:'1990',color:'#ffd700',zscore:3.42},
  {code:'HAM',year:'2020',color:'#27f4d2',zscore:3.18},
  {code:'MSC',year:'2003',color:'#e80020',zscore:2.95},
  {code:'VER',year:'2023',color:'#0600ef',zscore:2.87},
  {code:'VET',year:'2011',color:'#555555',zscore:2.74},
  {code:'HAM',year:'2017',color:'#27f4d2',zscore:2.61},
  {code:'RAI',year:'2005',color:'#b6babd',zscore:2.48},
  {code:'MSC',year:'2000',color:'#e80020',zscore:2.35},
  {code:'ALO',year:'2007',color:'#00665f',zscore:2.22},
  {code:'BUT',year:'2009',color:'#ef87b4',zscore:2.08},
  {code:'LEC',year:'2022',color:'#e80020',zscore:1.95},
  {code:'NOR',year:'2024',color:'#ff8000',zscore:1.82},
  {code:'ROS',year:'2014',color:'#00d2be',zscore:1.68},
  {code:'PRO',year:'1991',color:'#e80020',zscore:1.55}
];

const maxZ = 4;
const rows = document.getElementById('rows');

data.forEach((d, i) => {
  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = `
    <div class="rank">${i + 1}</div>
    <div class="code" style="color:${d.color}">${d.code}</div>
    <div class="year">${d.year}</div>
    <div class="bar-track">
      <div class="bar-fill" style="width:${d.zscore/maxZ*100}%;background:${d.color}">
        <div class="zscore">σ ${d.zscore.toFixed(2)}</div>
      </div>
    </div>
  `;
  rows.appendChild(row);
});
</script>
</body>
</html>
