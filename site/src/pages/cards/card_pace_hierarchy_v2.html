<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pace Hierarchy — v2</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:#060606;display:flex;align-items:center;justify-content:center;min-height:100vh;}
.card{width:1080px;height:1080px;background:#060606;position:relative;overflow:hidden;display:flex;flex-direction:column;padding:64px 64px 48px;}
.header{flex-shrink:0;margin-bottom:16px;display:flex;justify-content:space-between;align-items:flex-start;}
.title{font-family:'Bebas Neue',sans-serif;font-size:52px;letter-spacing:0.06em;color:#e0e0e0;line-height:1;}
.subtitle{font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:0.18em;color:#252525;margin-top:5px;}
.wm{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.15em;color:#181818;align-self:flex-end;}

/* Leader strip */
.leader{flex-shrink:0;display:flex;align-items:center;position:relative;padding:22px 28px;margin-bottom:18px;border-radius:4px;overflow:hidden;}
.leader-bg{position:absolute;inset:0;border-radius:4px;pointer-events:none;}
.leader-accent{position:absolute;left:0;top:0;bottom:0;width:5px;border-radius:4px 0 0 4px;}
.leader-rank{font-family:'Bebas Neue',sans-serif;font-size:56px;letter-spacing:0.04em;line-height:1;margin-right:20px;position:relative;z-index:1;}
.leader-info{flex:1;position:relative;z-index:1;}
.leader-name{font-family:'Bebas Neue',sans-serif;font-size:38px;letter-spacing:0.06em;line-height:1;}
.leader-sub{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.14em;color:#2a2a2a;margin-top:4px;}
.leader-pace-wrap{position:relative;z-index:1;text-align:right;}
.leader-pace{font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:600;letter-spacing:0.04em;}
.leader-pace-label{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:0.14em;color:#333;margin-top:2px;}

/* Stack rows */
.stack{flex:1;display:flex;flex-direction:column;gap:0;}
.stack-row{display:grid;grid-template-columns:44px 170px 1fr 90px;align-items:center;border-top:1px solid #0d0d14;min-height:0;}
.stack-row:last-child{border-bottom:1px solid #0d0d14;}
.s-rank{font-family:'Bebas Neue',sans-serif;font-size:24px;text-align:center;}
.s-info{padding:10px 12px;}
.s-team{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:0.06em;line-height:1;}
.s-drivers{font-family:'IBM Plex Mono',monospace;font-size:8px;letter-spacing:0.1em;color:#2a2a2a;margin-top:2px;}
.s-bar-wrap{height:24px;position:relative;}
.s-bar{position:absolute;left:0;top:0;height:100%;border-radius:0 2px 2px 0;}
.s-val{font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:0.06em;text-align:right;padding-right:8px;white-space:nowrap;}
</style></head>
<body>
<div class="card">
  <div class="header">
    <div><div class="title">PACE HIERARCHY</div>
    <div class="subtitle">2026 · R02 · CHINA GP · RACE PACE DELTA — FastF1 DATA</div></div>
    <div class="wm">MOTORSPORTS-VISUALISED</div>
  </div>
  <div class="leader" id="leader"></div>
  <div class="stack" id="stack"></div>
</div>
<script>
const teams=[
  {team:"Mercedes",color:"#27f4d2",median:96.413,gap:0.0,d1:"ANT",d2:"RUS"},
  {team:"Ferrari",color:"#e80020",median:96.837,gap:0.424,d1:"LEC",d2:"HAM"},
  {team:"Haas F1 Team",color:"#b6babd",median:97.496,gap:1.083,d1:"BEA",d2:"OCO"},
  {team:"Alpine",color:"#ff87bc",median:97.589,gap:1.176,d1:"GAS",d2:"COL"},
  {team:"Red Bull Racing",color:"#0600ef",median:97.716,gap:1.303,d1:"VER",d2:"HAD"},
  {team:"Racing Bulls",color:"#fcd700",median:98.047,gap:1.634,d1:"LAW",d2:"LIN"},
  {team:"Audi",color:"#ff2d00",median:98.388,gap:1.975,d1:"HUL",d2:"???"},
  {team:"Williams",color:"#00a0dd",median:98.708,gap:2.295,d1:"SAI",d2:"???"},
  {team:"Cadillac",color:"#444444",median:99.813,gap:3.400,d1:"BOT",d2:"PER"},
  {team:"Aston Martin",color:"#00665f",median:100.356,gap:3.943,d1:"ALO",d2:"STR"}
];
const FOCUS_TEAMS=new Set(["Mercedes","Ferrari"]);
const MAX_GAP=Math.max(...teams.map(t=>t.gap))+0.3;

// Leader
const L=teams[0];
const leaderEl=document.getElementById('leader');
leaderEl.innerHTML=`
  <div class="leader-bg" style="background:linear-gradient(90deg, ${L.color}12 0%, ${L.color}06 40%, transparent 100%);border:1px solid ${L.color}25;border-radius:4px;"></div>
  <div class="leader-accent" style="background:${L.color};box-shadow:0 0 12px ${L.color}80;"></div>
  <div class="leader-rank" style="color:${L.color};">P1</div>
  <div class="leader-info">
    <div class="leader-name" style="color:${L.color};">${L.team.toUpperCase()}</div>
    <div class="leader-sub">${L.d1} / ${L.d2}</div>
  </div>
  <div class="leader-pace-wrap">
    <div class="leader-pace" style="color:${L.color};">${L.median.toFixed(3)}s</div>
    <div class="leader-pace-label">MEDIAN PACE</div>
  </div>`;

// Stack
const stack=document.getElementById('stack');
teams.slice(1).forEach((t,i)=>{
  const isHL=FOCUS_TEAMS.has(t.team);
  const pct=Math.min((t.gap/MAX_GAP)*100,95);
  const nameOp=isHL?1:t.gap<1.5?0.35:t.gap<2.5?0.22:0.12;
  const barOp=isHL?0.75:t.gap<1.5?0.35:t.gap<2.5?0.2:0.1;
  const valCol=isHL?t.color:t.gap<1.5?'#333':'#1a1a1a';
  const rankCol=isHL?t.color:'#1a1a1a';
  const row=document.createElement('div');row.className='stack-row';
  row.innerHTML=`
    <div class="s-rank" style="color:${rankCol};">${i+2}</div>
    <div class="s-info">
      <div class="s-team" style="color:${t.color};opacity:${nameOp};">${t.team}</div>
      <div class="s-drivers">${t.d1} / ${t.d2}</div>
    </div>
    <div class="s-bar-wrap"><div class="s-bar" style="width:${pct}%;background:${t.color};opacity:${barOp};"></div></div>
    <div class="s-val" style="color:${valCol};">+${t.gap.toFixed(3)}s</div>`;
  stack.appendChild(row);
});
</script>
</body></html>
