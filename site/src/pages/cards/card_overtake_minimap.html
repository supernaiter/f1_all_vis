<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>Overtake Replay Minimap — Motorsports Visualised</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:transparent;display:flex;justify-content:center;align-items:center;min-height:100vh}
.card{width:1080px;height:1080px;background:#060606;position:relative;overflow:hidden;padding:48px 56px}
.wm{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.15em;color:#181818;position:absolute;top:28px;right:56px;text-transform:uppercase}
.ttl{font-family:'Bebas Neue',sans-serif;font-size:52px;letter-spacing:0.06em;color:#e0e0e0;line-height:1}
.sub{font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:0.18em;color:#252525;text-transform:uppercase;margin-top:6px}
.caption{font-family:'Bebas Neue',sans-serif;font-size:36px;color:#e0e0e0;text-align:center;margin-top:16px;letter-spacing:0.04em}
.caption-sub{font-family:'IBM Plex Mono',monospace;font-size:14px;color:#555;text-align:center;letter-spacing:0.15em;margin-top:4px}
svg{display:block;margin:24px auto 0}
.meta{display:flex;justify-content:center;gap:48px;margin-top:32px}
.meta-item{text-align:center}
.meta-val{font-family:'Bebas Neue',sans-serif;font-size:48px;line-height:1}
.meta-label{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#555;letter-spacing:0.15em;margin-top:4px}
</style>
</head>
<body>
<div class="card">
  <div class="wm">MOTORSPORTS-VISUALISED</div>
  <div class="ttl">OVERTAKE REPLAY</div>
  <div class="sub">2024 · BAHRAIN GP</div>
  <div class="caption">LAP 12 — NOR PASSES PER — TURN 1</div>
  <div class="caption-sub">BRAKING ZONE · INSIDE LINE</div>

  <svg width="860" height="500" viewBox="0 0 860 500">
    <!-- 簡略バーレーントラック -->
    <path d="M430 40 L700 40 Q760 40 760 100 L760 260 Q760 320 700 320 L600 320 Q560 320 560 360 L560 440 Q560 460 540 460 L320 460 Q300 460 300 440 L300 360 Q300 320 260 320 L160 320 Q100 320 100 260 L100 100 Q100 40 160 40 Z"
          fill="none" stroke="#1a1a2e" stroke-width="28" stroke-linejoin="round"/>
    <!-- ターン1ゾーン -->
    <circle cx="740" cy="70" r="20" fill="#ff800020" stroke="#ff8000" stroke-width="2"/>
    <text x="740" y="75" text-anchor="middle" fill="#ff8000" font-family="IBM Plex Mono" font-size="11" font-weight="600">T1</text>
    <!-- PER位置（外側）-->
    <circle cx="730" cy="100" r="14" fill="#0600ef"/>
    <text x="730" y="105" text-anchor="middle" fill="#fff" font-family="IBM Plex Mono" font-size="10" font-weight="600">PER</text>
    <!-- NOR位置（内側）-->
    <circle cx="710" cy="80" r="14" fill="#ff8000"/>
    <text x="710" y="85" text-anchor="middle" fill="#000" font-family="IBM Plex Mono" font-size="10" font-weight="600">NOR</text>
    <!-- 矢印 -->
    <line x1="720" y1="95" x2="718" y2="84" stroke="#ff8000" stroke-width="2" marker-end="url(#arrow)"/>
    <defs>
      <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6" fill="#ff8000"/>
      </marker>
    </defs>
    <!-- PASS ラベル -->
    <rect x="650" y="56" width="48" height="20" rx="3" fill="#ff800030"/>
    <text x="674" y="70" text-anchor="middle" fill="#ff8000" font-family="IBM Plex Mono" font-size="11" font-weight="600">PASS</text>
  </svg>

  <div class="meta">
    <div class="meta-item">
      <div class="meta-val" style="color:#ff8000">NOR</div>
      <div class="meta-label">ATTACKER</div>
    </div>
    <div class="meta-item">
      <div class="meta-val" style="color:#e0e0e0">→</div>
      <div class="meta-label">LAP 12</div>
    </div>
    <div class="meta-item">
      <div class="meta-val" style="color:#0600ef">PER</div>
      <div class="meta-label">DEFENDER</div>
    </div>
  </div>
</div>
</body>
</html>
